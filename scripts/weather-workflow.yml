# Готовый workflow для .github/workflows/weather.yml.
#
# Положить на место нужно через веб-интерфейс GitHub: Add file → Create new file →
# путь .github/workflows/weather.yml → вставить всё, что ниже (без этих строк комментария можно).
# API-токен, которым наполняется репозиторий, не имеет права писать в .github/workflows —
# GitHub отвечает 404, поэтому файл не создаётся автоматически.
#
# После создания: Actions → weather → Run workflow (первый запуск вручную, дальше раз в 15 минут).

name: weather

# GitHub Pages serves static files only, so the .txt is rebuilt here.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the text files
        run: python scripts/weather.py

      - name: Commit only when the line changed
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh weather"
          git push
